<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Surfers 3D - Mobile Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #2f3542; font-family: 'Arial Black', sans-serif; touch-action: none; user-select: none; }
        #ui { position: absolute; top: 5%; left: 5%; color: #fff; text-shadow: 3px 3px 0px #f0932b; font-size: 32px; z-index: 10; pointer-events: none; }
        #game-over { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; color: #2f3542; padding: 40px; text-align: center;
            display: none; border-radius: 30px; box-shadow: 0 20px 0px #f0932b; z-index: 20; width: 280px;
        }
        button { background: #f0932b; color: white; border: none; padding: 15px 30px; font-size: 24px; border-radius: 15px; cursor: pointer; margin-top: 20px; width: 100%; box-shadow: 0 5px 0px #d35400; }
        button:active { transform: translateY(3px); box-shadow: 0 2px 0px #d35400; }
    </style>
</head>
<body>

<div id="ui">COINS: <span id="score">0</span></div>
<div id="game-over">
    <h1 style="margin:0;">BUSTED!</h1>
    <p>You caught by the Inspector!</p>
    <p style="font-size:24px;">Coins: <span id="final-score">0</span></p>
    <button onclick="location.reload()">RESUME</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com" } }
</script>

<script type="module">
import * as THREE from 'three';

// --- 配置與常數 ---
const CONFIG = {
    LANE_WIDTH: 3.5,
    LANES: [-3.5, 0, 3.5],
    SPEED: 0.7,
    GRAVITY: 0.012,
    JUMP_V: 0.35
};

let scene, camera, renderer, player, inspector, clock;
let score = 0, isGameOver = false;
let obstacles = [], tracks = [], coins = [];
let playerState = { lane: 1, y: 0, vy: 0, isJumping: false, targetX: 0, currentX: 0, stumble: 0 };

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x70a1ff);
    scene.fog = new THREE.Fog(0x70a1ff, 20, 150);

    camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 8, 14);
    camera.lookAt(0, 2, -5);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 光照
    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(10, 20, 10);
    sun.castShadow = true;
    scene.add(sun);

    // 1. 創建玩家 (Jake 風格)
    player = createHumanoid(0x3742fa, 0xffccaa);
    scene.add(player);

    // 2. 創建保安 (追逐者)
    inspector = createHumanoid(0x2f3542, 0xffccaa, true);
    scene.add(inspector);

    // 3. 初始場景
    createEnvironment();
    for(let i=0; i<4; i++) spawnTrackSection(i * -40);

    clock = new THREE.Clock();
    setupControls();
    window.addEventListener('resize', onResize);
    animate();
}

// 建立通用人形 (玩家/保安)
function createHumanoid(clothColor, skinColor, isInspector = false) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.6, 0.6), new THREE.MeshToonMaterial({color: clothColor}));
    body.position.y = 1.3;
    body.castShadow = true;
    g.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshToonMaterial({color: skinColor}));
    head.position.y = 2.5;
    g.add(head);
    if(isInspector) {
        const cap = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.2, 0.9), new THREE.MeshToonMaterial({color: 0x000}));
        cap.position.y = 2.9;
        g.add(cap);
    }
    return g;
}

function createEnvironment() {
    const wallGeo = new THREE.BoxGeometry(1, 20, 400);
    const wallMat = new THREE.MeshToonMaterial({color: 0x576574});
    const lWall = new THREE.Mesh(wallGeo, wallMat); lWall.position.set(-10, 5, -100);
    const rWall = new THREE.Mesh(wallGeo, wallMat); rWall.position.set(10, 5, -100);
    scene.add(lWall, rWall);
}

function spawnTrackSection(z) {
    const geo = new THREE.PlaneGeometry(16, 41);
    const mat = new THREE.MeshToonMaterial({color: 0x222f3e});
    const ground = new THREE.Mesh(geo, mat);
    ground.rotation.x = -Math.PI/2; ground.position.z = z;
    ground.receiveShadow = true;
    scene.add(ground);
    tracks.push(ground);
    
    // 每段路隨機生成障礙
    if (z < -10) {
        const lane = Math.floor(Math.random()*3);
        const rand = Math.random();
        if (rand > 0.4) spawnObstacle(CONFIG.LANES[lane], z);
        else spawnCoin(CONFIG.LANES[lane], z);
    }
}

function spawnObstacle(x, z) {
    let obs;
    if (Math.random() > 0.5) { // 火車
        obs = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 5, 10), new THREE.MeshToonMaterial({color: 0x2980b9}));
        const win = new THREE.Mesh(new THREE.BoxGeometry(3.3, 1, 8), new THREE.MeshToonMaterial({color: 0xffffff}));
        win.position.y = 1.5; obs.add(body, win);
        obs.position.set(x, 2.5, z);
        obs.userData = { fatal: true, type: 'train' };
    } else { // 路障
        obs = new THREE.Mesh(new THREE.BoxGeometry(3, 1.5, 0.5), new THREE.MeshToonMaterial({color: 0xe67e22}));
        obs.position.set(x, 0.75, z);
        obs.userData = { fatal: false, type: 'barrier' };
    }
    scene.add(obs);
    obstacles.push(obs);
}

function spawnCoin(x, z) {
    const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.2, 16), new THREE.MeshToonMaterial({color: 0xf1c40f}));
    coin.rotation.z = Math.PI/2;
    coin.position.set(x, 1.5, z);
    scene.add(coin);
    coins.push(coin);
}

function animate() {
    if (isGameOver) return;
    requestAnimationFrame(animate);

    // 1. 玩家物理
    if (playerState.isJumping) {
        playerState.vy -= CONFIG.GRAVITY;
        playerState.y += playerState.vy;
        if (playerState.y <= 0) { playerState.y = 0; playerState.isJumping = false; }
    }
    playerState.targetX = CONFIG.LANES[playerState.lane];
    playerState.currentX += (playerState.targetX - playerState.currentX) * 0.2;
    player.position.set(playerState.currentX, playerState.y, 0);
    player.rotation.z = (playerState.targetX - playerState.currentX) * 0.1; // 換線傾斜

    // 2. 追逐者邏輯 (若撞到路障沒死，保安會逼近)
    let inspectorTargetZ = (playerState.stumble > 0) ? 3 : 8;
    if (playerState.stumble > 0) playerState.stumble -= 0.01;
    inspector.position.z += (inspectorTargetZ - inspector.position.z) * 0.05;
    inspector.position.x = player.position.x;
    inspector.position.y = Math.abs(Math.sin(Date.now()*0.01)) * 0.2; // 跑步跳動

    // 3. 捲動世界
    const speed = CONFIG.SPEED + (score/10000);
    obstacles.forEach((obj, i) => {
        obj.position.z += speed;
        // 碰撞檢測
        if (Math.abs(obj.position.z - player.position.z) < 1.5 && Math.abs(obj.position.x - player.position.x) < 1.5) {
            if (obj.userData.fatal && playerState.y < 3) endGame();
            else if (!obj.userData.fatal && playerState.y < 1.5) playerState.stumble = 2; // 撞到路障，保安靠近
        }
        if (obj.position.z > 20) { scene.remove(obj); obstacles.splice(i, 1); }
    });

    coins.forEach((c, i) => {
        c.position.z += speed;
        c.rotation.y += 0.05;
        if (player.position.distanceTo(c.position) < 2) {
            scene.remove(c); coins.splice(i, 1); score += 100;
            document.getElementById('score').innerText = score;
        }
        if (c.position.z > 20) { scene.remove(c); coins.splice(i, 1); }
    });

    tracks.forEach(t => {
        t.position.z += speed;
        if (t.position.z > 40) {
            t.position.z -= 160;
            spawnTrackSection(t.position.z - 40);
        }
    });

    renderer.render(scene, camera);
}

function setupControls() {
    let startX, startY;
    window.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; });
    window.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 30 && playerState.lane < 2) playerState.lane++;
            else if (dx < -30 && playerState.lane > 0) playerState.lane--;
        } else {
            if (dy < -30 && !playerState.isJumping) { playerState.isJumping = true; playerState.vy = CONFIG.JUMP_V; }
            if (dy > 30) { player.scale.y = 0.5; setTimeout(()=>player.scale.y = 1, 500); }
        }
    });
    // 鍵盤支援
    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' && playerState.lane > 0) playerState.lane--;
        if (e.key === 'ArrowRight' && playerState.lane < 2) playerState.lane++;
        if ((e.key === 'ArrowUp' || e.key === ' ') && !playerState.isJumping) { playerState.isJumping = true; playerState.vy = CONFIG.JUMP_V; }
    });
}

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function endGame() {
    isGameOver = true;
    document.getElementById('game-over').style.display = 'block';
    document.getElementById('final-score').innerText = score;
}

init();
</script>
</body>
</html>
