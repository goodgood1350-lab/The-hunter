<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Run 3D - Ultimate Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; touch-action: none; user-select: none; }
        
        /* UI 層 */
        #ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        
        /* 分數與連擊 */
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
        #score-box { color: #fff; text-shadow: 0 0 10px #0984e3; font-style: italic; }
        #score-label { font-size: 14px; color: #74b9ff; letter-spacing: 2px; }
        #score { font-size: 42px; line-height: 1; }
        
        #combo-box { text-align: right; transform-origin: right center; transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #combo-label { font-size: 14px; color: #ffeaa7; letter-spacing: 1px; }
        #combo-val { font-size: 36px; color: #fdcb6e; text-shadow: 0 0 15px #e17055; }
        
        /* 遊戲結束與選單 */
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity 0.3s; backdrop-filter: blur(5px); }
        .card { background: linear-gradient(145deg, #2d3436, #000000); border: 2px solid #0984e3; color: white; padding: 40px; border-radius: 20px; text-align: center; width: 300px; box-shadow: 0 0 30px rgba(9, 132, 227, 0.3); transform: translateY(0); transition: transform 0.3s; }
        h1 { margin: 0; font-size: 48px; background: linear-gradient(to right, #74b9ff, #0984e3); -webkit-background-clip: text; color: transparent; font-style: italic; }
        p { color: #b2bec3; margin: 10px 0 30px; }
        
        button { background: #0984e3; color: white; border: none; padding: 15px 0; width: 100%; font-size: 20px; border-radius: 10px; cursor: pointer; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 5px 0 #065289; transition: all 0.1s; pointer-events: auto; }
        button:active { transform: translateY(4px); box-shadow: 0 1px 0 #065289; }
        
        /* CRT 掃描線特效 (復古濾鏡) */
        #crt-effect { position: absolute; inset: 0; z-index: 5; pointer-events: none; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 3px, 3px 100%; opacity: 0.6; }
        
        /* 傷害紅屏特效 */
        #damage-flash { position: absolute; inset: 0; background: red; opacity: 0; pointer-events: none; z-index: 8; transition: opacity 0.1s; mix-blend-mode: overlay; }
    </style>
</head>
<body>

<!-- 視覺特效層 -->
<div id="crt-effect"></div>
<div id="damage-flash"></div>

<!-- UI 層 -->
<div id="ui-layer">
    <div class="hud-top">
        <div id="score-box">
            <div id="score-label">SCORE</div>
            <div id="score">0</div>
        </div>
        <div id="combo-box">
            <div id="combo-label">COMBO</div>
            <div id="combo-val">x1</div>
        </div>
    </div>
</div>

<!-- 選單層 -->
<div id="overlay">
    <div class="card" id="menu-card">
        <h1>NEON<br>RUNNER</h1>
        <p>Swipe to Dodge. Don't Look Back.</p>
        <button id="start-btn">INITIATE RUN</button>
    </div>
</div>

<!-- Three.js 引入 -->
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// --- 遊戲參數配置 ---
const CONFIG = {
    LANES: [-3.5, 0, 3.5],   // 車道 X 座標
    INIT_SPEED: 0.7,         // 初始速度
    MAX_SPEED: 2.5,          // 最大速度
    GRAVITY: 0.022,          // 重力
    JUMP_FORCE: 0.45,        // 跳躍力
    SPEED_STEP: 0.00015,     // 速度增量
    SHAKE_DECAY: 0.9         // 震動衰減
};

// --- 全局變數 ---
let scene, camera, renderer, clock;
let player, hunter;
let obstacles = [], tracks = [], coins = [], particles = [];
let score = 0, highScore = localStorage.getItem('neon_run_high') || 0;
let isPlaying = false, isGameOver = false;
let currentSpeed = CONFIG.INIT_SPEED;
let combo = 1;

// 玩家物理狀態
let pState = { 
    lane: 1, y: 0, vy: 0, x: 0, 
    jumping: false, sliding: false, slideTime: 0, 
    stumble: 0, // 絆倒計時 (影響保安距離)
    invincible: 0 // 無敵時間
};

// 視覺特效狀態
let shakeIntensity = 0; // 相機震動強度

function init() {
    // 1. 場景初始化
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510); // 深夜色
    scene.fog = new THREE.FogExp2(0x050510, 0.025); // 濃霧

    // 2. 相機
    camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 6, 11);
    camera.lookAt(0, 2, -5);

    // 3. 渲染器
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 4. 燈光 (霓虹風格)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);
    
    // 主光源 (暖色路燈)
    const mainLight = new THREE.DirectionalLight(0xff9f43, 1.5);
    mainLight.position.set(10, 20, 10);
    mainLight.castShadow = true;
    scene.add(mainLight);

    // 玩家自帶光源 (藍色科技感)
    const playerLight = new THREE.PointLight(0x0984e3, 2, 15);
    playerLight.position.set(0, 4, 2);
    scene.add(playerLight);

    // 5. 創建角色與環境
    createPlayer();
    createHunter();
    buildInitialWorld();

    // 6. 事件綁定
    document.getElementById('start-btn').onclick = startGame;
    setupControls();
    window.addEventListener('resize', onResize);

    // 7. 啟動循環
    clock = new THREE.Clock();
    animate();
}

// --- 角色創建 ---
function createPlayer() {
    player = new THREE.Group();
    
    // 身體 (發光材質)
    const bodyGeo = new THREE.BoxGeometry(1, 1.4, 0.6);
    const bodyMat = new THREE.MeshPhongMaterial({ color: 0x0984e3, emissive: 0x0984e3, emissiveIntensity: 0.2 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.2;
    body.castShadow = true;
    
    // 頭部
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshPhongMaterial({ color: 0xffffff }));
    head.position.y = 2.2;
    
    // 噴射背包 (裝飾)
    const jetpack = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.3), new THREE.MeshPhongMaterial({ color: 0x555555 }));
    jetpack.position.set(0, 1.4, 0.4);
    
    player.add(body, head, jetpack);
    scene.add(player);
}

function createHunter() {
    hunter = new THREE.Group();
    
    // 身體 (暗色)
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.8, 0.8), new THREE.MeshPhongMaterial({ color: 0x2d3436 }));
    body.position.y = 1.4;
    
    // 警示燈 (紅色)
    const lightGeo = new THREE.CylinderGeometry(0.1, 0.2, 0.2);
    const lightMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const siren = new THREE.Mesh(lightGeo, lightMat);
    siren.position.set(0.4, 2.4, 0);
    
    // 實際紅光
    const spotLight = new THREE.SpotLight(0xff0000, 10, 15, 0.6, 0.5, 1);
    spotLight.position.set(0, 4, 0);
    spotLight.target.position.set(0, 0, -5);
    hunter.add(spotLight.target);
    
    hunter.add(body, siren, spotLight);
    hunter.position.z = 8; // 初始距離
    scene.add(hunter);
}

// --- 世界生成 ---
function buildInitialWorld() {
    // 兩側建築牆
    const wallGeo = new THREE.BoxGeometry(2, 20, 200);
    const wallMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
    const leftWall = new THREE.Mesh(wallGeo, wallMat); leftWall.position.set(-10, 5, -80);
    const rightWall = new THREE.Mesh(wallGeo, wallMat); rightWall.position.set(10, 5, -80);
    scene.add(leftWall, rightWall);

    // 地面與軌道
    for(let i=0; i<6; i++) spawnTrackSection(i * -40);
}

function spawnTrackSection(z) {
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(20, 40),
        new THREE.MeshPhongMaterial({ color: 0x1e272e, shininess: 10 }) // 濕潤路面感
    );
    ground.rotation.x = -Math.PI/2;
    ground.position.z = z;
    ground.receiveShadow = true;
    scene.add(ground);
    tracks.push(ground);
    
    // 裝飾線 (Neon Lines)
    const line = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 40), new THREE.MeshBasicMaterial({ color: 0x00cec9 }));
    line.rotation.x = -Math.PI/2;
    line.position.set(-3.5/2, 0.02, z);
    scene.add(line);
    tracks.push(line); // 簡單處理，一起回收

    if (z < -20) generateObstacles(z);
}

function generateObstacles(z) {
    const lanes = [0, 1, 2];
    const count = Math.random() > 0.7 ? 2 : 1;
    
    for(let i=0; i<count; i++) {
        const laneIdx = lanes.splice(Math.floor(Math.random()*lanes.length), 1)[0];
        const x = CONFIG.LANES[laneIdx];
        
        if (Math.random() > 0.5) {
            // 火車 (致命)
            const train = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 4, 10), new THREE.MeshPhongMaterial({ color: 0xd63031 }));
            body.position.y = 2;
            const light = new THREE.Mesh(new THREE.CircleGeometry(0.6, 16), new THREE.MeshBasicMaterial({ color: 0xfffa65 }));
            light.position.set(0, 1.5, 5.1);
            train.add(body, light);
            train.position.set(x, 0, z);
            train.userData = { fatal: true, hitBox: {w: 3, h: 4, d: 10} };
            scene.add(train);
            obstacles.push(train);
        } else {
            // 路障 (絆倒)
            const barrier = new THREE.Mesh(new THREE.BoxGeometry(3, 1.2, 0.5), new THREE.MeshPhongMaterial({ color: 0xfdcb6e }));
            barrier.position.set(x, 0.6, z);
            barrier.castShadow = true;
            barrier.userData = { fatal: false, hitBox: {w: 3, h: 1.2, d: 0.5} };
            scene.add(barrier);
            obstacles.push(barrier);
        }
    }
    
    // 剩餘車道放金幣
    lanes.forEach(l => {
        if(Math.random() > 0.3) spawnCoins(CONFIG.LANES[l], z);
    });
}

function spawnCoins(x, z) {
    for(let i=0; i<3; i++) {
        const coin = new THREE.Mesh(
            new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16),
            new THREE.MeshBasicMaterial({ color: 0xffeb3b })
        );
        coin.rotation.z = Math.PI/2;
        coin.position.set(x, 1.5, z + i*2.5);
        scene.add(coin);
        coins.push(coin);
    }
}

// --- 核心循環 ---
function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    if (isPlaying && !isGameOver) {
        // 1. 遊戲進程
        score += Math.floor(currentSpeed * combo);
        currentSpeed = Math.min(CONFIG.MAX_SPEED, currentSpeed + CONFIG.SPEED_STEP);
        
        document.getElementById('score').innerText = score;

        // 2. 玩家物理
        handlePlayerPhysics(delta);

        // 3. 追逐者 AI (重點：絆倒時靠近)
        let targetHunterZ = 8; // 默認安全距離
        if (pState.stumble > 0) {
            pState.stumble -= delta;
            targetHunterZ = 3.5; // 絆倒時非常近
        }
        // 平滑移動保安
        hunter.position.z += (targetHunterZ - hunter.position.z) * 2 * delta;
        hunter.position.x += (player.position.x - hunter.position.x) * 5 * delta;
        
        // 4. 世界移動
        updateWorld(currentSpeed);

        // 5. 相機震動 (Screen Shake)
        if (shakeIntensity > 0) {
            camera.position.x = (Math.random() - 0.5) * shakeIntensity;
            camera.position.y = 6 + (Math.random() - 0.5) * shakeIntensity;
            shakeIntensity *= CONFIG.SHAKE_DECAY; // 逐漸衰減
            if (shakeIntensity < 0.05) shakeIntensity = 0;
        } else {
            // 平滑回正
            camera.position.x += (0 - camera.position.x) * 0.1;
            camera.position.y += (6 - camera.position.y) * 0.1;
        }
    }

    renderer.render(scene, camera);
}

function handlePlayerPhysics(dt) {
    // 跳躍
    if (pState.jumping) {
        pState.vy -= CONFIG.GRAVITY;
        pState.y += pState.vy;
        if (pState.y <= 0) { pState.y = 0; pState.jumping = false; }
    }
    
    // 滑行
    if (pState.sliding) {
        pState.slideTime -= dt;
        if (pState.slideTime <= 0) {
            pState.sliding = false;
            player.scale.y = 1;
            player.position.y = pState.y + 1.2; // 修正模型中心
        } else {
            player.scale.y = 0.5;
        }
    }

    // 車道切換 (Lerp)
    pState.x += (CONFIG.LANES[pState.lane] - pState.x) * 15 * dt;
    
    // 更新模型位置
    player.position.x = pState.x;
    player.position.y = pState.y + (pState.sliding ? 0.6 : 1.2); // 調整中心點
    
    // 跑步傾斜效果
    player.rotation.z = (pState.x - CONFIG.LANES[pState.lane]) * -0.15;
}

function updateWorld(speed) {
    // 移動障礙物
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obj = obstacles[i];
        obj.position.z += speed;
        
        // 碰撞檢測
        if (Math.abs(obj.position.z - player.position.z) < 2 && Math.abs(obj.position.x - player.position.x) < 1.5) {
            if (Math.abs(player.position.y - obj.position.y) < 2) {
                hitObstacle(obj);
            }
        }
        
        if (obj.position.z > 15) { scene.remove(obj); obstacles.splice(i, 1); }
    }

    // 移動金幣
    for (let i = coins.length - 1; i >= 0; i--) {
        let c = coins[i];
        c.position.z += speed;
        c.rotation.y += 0.1;
        
        // 吃金幣
        if (c.position.distanceTo(player.position) < 1.5) {
            scene.remove(c); coins.splice(i, 1);
            score += 100;
            combo = Math.min(combo + 1, 10); // 上限 x10
            updateComboUI();
        }
        
        if (c.position.z > 15) { scene.remove(c); coins.splice(i, 1); }
    }

    // 無限跑道
    tracks.forEach(t => {
        t.position.z += speed;
        if (t.position.z > 40) {
            t.position.z -= 240;
            if (t.geometry.type === 'PlaneGeometry') spawnTrackSection(t.position.z - 40);
        }
    });
}

function hitObstacle(obj) {
    if (pState.invincible > 0) return;

    if (obj.userData.fatal) {
        // 致命撞擊
        triggerShake(1.5); // 強烈震動
        gameOver();
    } else {
        // 絆倒 (非致命)
        if (pState.stumble > 0) {
            // 如果已經絆倒還沒恢復，再次撞擊 = 死亡
            gameOver();
        } else {
            pState.stumble = 2.0; // 絆倒 2 秒
            currentSpeed = CONFIG.INIT_SPEED; // 速度重置
            combo = 1; // 連擊中斷
            updateComboUI();
            triggerShake(0.8); // 中等震動
            
            // 紅屏閃爍
            const flash = document.getElementById('damage-flash');
            flash.style.opacity = 0.5;
            setTimeout(() => flash.style.opacity = 0, 100);
            
            // 短暫無敵防止連續判定
            pState.invincible = 0.5;
            setTimeout(() => pState.invincible = 0, 500);
            
            // 移除該障礙物以免卡住
            scene.remove(obj);
            obstacles = obstacles.filter(o => o !== obj);
        }
    }
}

function triggerShake(intensity) {
    shakeIntensity = intensity;
}

function updateComboUI() {
    const el = document.getElementById('combo-val');
    const box = document.getElementById('combo-box');
    el.innerText = 'x' + combo;
    el.style.color = combo > 5 ? '#ff7675' : '#fdcb6e';
    
    // CSS 動畫
    box.style.transform = 'scale(1.5)';
    setTimeout(() => box.style.transform = 'scale(1)', 150);
}

// --- 控制系統 ---
function setupControls() {
    let sX, sY;
    
    // 觸控
    window.addEventListener('touchstart', e => { sX = e.touches[0].clientX; sY = e.touches[0].clientY; });
    window.addEventListener('touchend', e => {
        if (!isPlaying) return;
        const dX = e.changedTouches[0].clientX - sX;
        const dY = e.changedTouches[0].clientY - sY;
        if (Math.abs(dX) > Math.abs(dY)) {
            if (dX > 30 && pState.lane > 0) pState.lane--; // 注意：ThreeJS 座標系反向
            if (dX < -30 && pState.lane < 2) pState.lane++;
        } else {
            if (dY < -30) jump();
            if (dY > 30) slide();
        }
    });

    // 鍵盤
    window.addEventListener('keydown', e => {
        if (!isPlaying) return;
        if (e.key === 'ArrowLeft' && pState.lane < 2) pState.lane++;
        if (e.key === 'ArrowRight' && pState.lane > 0) pState.lane--;
        if (e.key === 'ArrowUp') jump();
        if (e.key === 'ArrowDown') slide();
    });
}

function jump() {
    if (!pState.jumping && !pState.sliding) {
        pState.jumping = true;
        pState.vy = CONFIG.JUMP_FORCE;
    }
}

function slide() {
    if (!pState.sliding && !pState.jumping) {
        pState.sliding = true;
        pState.slideTime = 0.8;
    }
}

function startGame() {
    document.getElementById('overlay').style.opacity = 0;
    setTimeout(() => document.getElementById('overlay').style.display = 'none', 300);
    
    // 重置狀態
    score = 0; combo = 1; currentSpeed = CONFIG.INIT_SPEED;
    pState = { lane: 1, y: 0, vy: 0, x: 0, jumping: false, sliding: false, slideTime: 0, stumble: 0, invincible: 0 };
    obstacles.forEach(o => scene.remove(o)); obstacles = [];
    coins.forEach(c => scene.remove(c)); coins = [];
    
    isPlaying = true;
    isGameOver = false;
    updateComboUI();
}

function gameOver() {
    isPlaying = false;
    isGameOver = true;
    document.getElementById('overlay').style.display = 'flex';
    setTimeout(() => document.getElementById('overlay').style.opacity = 1, 10);
    
    document.getElementById('menu-card').innerHTML = `
        <h1 style="color:#d63031">CRASHED!</h1>
        <p>Final Score: ${score}</p>
        <button onclick="location.reload()">REBOOT SYSTEM</button>
    `;
}

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

init();
</script>
</body>
</html>
