<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Run 3D - Ultimate Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; touch-action: none; user-select: none; }
        #ui { position: absolute; top: 5%; left: 5%; color: #fff; text-shadow: 0 0 10px #f0932b; font-size: 32px; z-index: 10; font-style: italic; pointer-events: none; }
        #combo { position: absolute; top: 12%; left: 5%; color: #ffeb3b; font-size: 20px; transition: transform 0.2s; z-index: 10; }
        #high-score { position: absolute; top: 5%; right: 5%; color: #74b9ff; font-size: 20px; z-index: 10; }
        
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; transition: 0.3s; }
        .card { background: #fff; color: #2d3436; padding: 40px; border-radius: 30px; text-align: center; width: 280px; border-bottom: 8px solid #f0932b; }
        h1 { margin: 0; color: #e17055; font-size: 40px; line-height: 1; }
        button { background: #f0932b; color: white; border: none; padding: 15px 0; width: 100%; font-size: 24px; border-radius: 15px; cursor: pointer; margin-top: 25px; box-shadow: 0 6px 0 #d35400; font-weight: bold; }
        button:active { transform: translateY(4px); box-shadow: 0 2px 0 #d35400; }
        
        /* 掃描線效果增強氛圍 */
        #crt:after { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); z-index: 2; background-size: 100% 4px, 3px 100%; pointer-events: none; }
    </style>
</head>
<body>

<div id="crt"></div>
<div id="ui">SCORE: <span id="score">0</span></div>
<div id="combo">COMBO x<span id="combo-val">1</span></div>
<div id="high-score">BEST: <span id="high-score-val">0</span></div>

<div id="overlay">
    <div class="card" id="menu-card">
        <h1>SUBWAY<br>SURGE</h1>
        <p>Avoid trains. Don't get caught.</p>
        <button id="start-btn">START RUN</button>
    </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// --- 核心配置 ---
const CONFIG = {
    LANES: [-3.8, 0, 3.8],
    INIT_SPEED: 0.8,
    MAX_SPEED: 2.2,
    GRAVITY: 0.018,
    JUMP_V: 0.42,
    SPEED_STEP: 0.0001
};

let scene, camera, renderer, player, hunter, clock;
let score = 0, highScore = localStorage.getItem('run_high') || 0;
let isPlaying = false, combo = 1, currentSpeed = CONFIG.INIT_SPEED;
let obstacles = [], tracks = [], coins = [];
let pState = { lane: 1, y: 0, vy: 0, jumping: false, sliding: false, slideTime: 0, x: 0, stumble: 0 };

// 震動效果控制
let shakeIntensity = 0;

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a3d62);
    scene.fog = new THREE.Fog(0x0a3d62, 20, 150);

    camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 8, 14);
    camera.lookAt(0, 3, -5);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 光照 - 霓虹夜色風格
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const mainLight = new THREE.PointLight(0xf0932b, 2, 100);
    mainLight.position.set(0, 20, 10);
    scene.add(mainLight);

    createPlayer();
    createHunter();
    buildEnvironment();
    
    document.getElementById('high-score-val').innerText = highScore;
    document.getElementById('start-btn').onclick = startRun;
    
    clock = new THREE.Clock();
    setupControls();
    window.addEventListener('resize', onResize);
    animate();
}

function createPlayer() {
    player = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.6, 0.8), new THREE.MeshToonMaterial({color: 0x0984e3}));
    body.position.y = 1.3;
    body.castShadow = true;
    player.add(body);
    
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 12), new THREE.MeshToonMaterial({color: 0xffccaa}));
    head.position.y = 2.6;
    player.add(head);
    
    scene.add(player);
}

function createHunter() {
    hunter = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.8, 1), new THREE.MeshToonMaterial({color: 0x2d3436}));
    body.position.y = 1.4;
    hunter.add(body);
    const light = new THREE.SpotLight(0xff0000, 5, 20); // 警示燈
    light.position.set(0, 3, 0);
    hunter.add(light);
    hunter.position.z = 10;
    scene.add(hunter);
}

function buildEnvironment() {
    // 兩側建築/牆壁
    const wallGeo = new THREE.BoxGeometry(2, 40, 500);
    const wallMat = new THREE.MeshPhongMaterial({color: 0x1e272e});
    const lW = new THREE.Mesh(wallGeo, wallMat); lW.position.set(-12, 10, -100);
    const rW = new THREE.Mesh(wallGeo, wallMat); rW.position.set(12, 10, -100);
    scene.add(lW, rW);

    // 初始賽道
    for(let i=0; i<5; i++) createTrackPart(i * -40);
}

function createTrackPart(z) {
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(20, 42),
        new THREE.MeshPhongMaterial({color: 0x2c3e50})
    );
    ground.rotation.x = -Math.PI/2;
    ground.position.z = z;
    ground.receiveShadow = true;
    scene.add(ground);
    tracks.push(ground);

    if (z < -20) {
        const lane = Math.floor(Math.random()*3);
        if (Math.random() > 0.4) spawnObstacle(CONFIG.LANES[lane], z);
        else spawnCoin(CONFIG.LANES[lane], z);
    }
}

function spawnObstacle(x, z) {
    let type = Math.random();
    let mesh;
    if (type > 0.6) { // 火車 (高障礙)
        mesh = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(3.5, 5, 12), new THREE.MeshPhongMaterial({color: 0xe17055}));
        const neon = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.2, 12), new THREE.MeshBasicMaterial({color: 0x00d2d3}));
        neon.position.y = 1; mesh.add(body, neon);
        mesh.position.set(x, 2.5, z);
        mesh.userData = { fatal: true, hitBox: [1.7, 2.5, 6] };
    } else { // 路障 (低障礙)
        mesh = new THREE.Mesh(new THREE.BoxGeometry(3, 1.5, 0.8), new THREE.MeshPhongMaterial({color: 0xfdcb6e}));
        mesh.position.set(x, 0.75, z);
        mesh.userData = { fatal: false, hitBox: [1.5, 0.75, 0.4] };
    }
    scene.add(mesh);
    obstacles.push(mesh);
}

function spawnCoin(x, z) {
    const coin = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.15, 8, 16), new THREE.MeshPhongMaterial({color: 0xffeb3b, emissive: 0xffeb3b, emissiveIntensity: 0.5}));
    coin.position.set(x, 1.5, z);
    coin.rotation.y = Math.PI/2;
    scene.add(coin);
    coins.push(coin);
}

function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    if (isPlaying) {
        score += Math.floor(currentSpeed * combo);
        currentSpeed = Math.min(CONFIG.MAX_SPEED, currentSpeed + CONFIG.SPEED_STEP);
        document.getElementById('score').innerText = score;
        
        // 1. 物理系統
        if (pState.jumping) {
            pState.vy -= CONFIG.GRAVITY;
            pState.y += pState.vy;
            if (pState.y <= 0) { pState.y = 0; pState.jumping = false; }
        }
        if (pState.sliding) {
            pState.slideTime -= delta;
            if (pState.slideTime <= 0) { pState.sliding = false; player.scale.y = 1; }
        }

        pState.x += (CONFIG.LANES[pState.lane] - pState.x) * 0.2;
        player.position.set(pState.x, pState.y, 0);
        player.rotation.z = (pState.x - CONFIG.LANES[pState.lane]) * -0.05;

        // 2. 追逐者 AI
        let hunterZ = (pState.stumble > 0) ? 4 : 10;
        if (pState.stumble > 0) pState.stumble -= delta;
        hunter.position.z += (hunterZ - hunter.position.z) * 0.05;
        hunter.position.x = player.position.x;

        // 3. 環境位移與碰撞
        updateWorld(currentSpeed);
        
        // 4. 相機震動回饋
        if (shakeIntensity > 0) {
            camera.position.x = Math.random() * shakeIntensity;
            camera.position.y = 8 + Math.random() * shakeIntensity;
            shakeIntensity *= 0.9;
        } else {
            camera.position.x = 0;
            camera.position.y = 8;
        }
    }
    renderer.render(scene, camera);
}

function updateWorld(s) {
    obstacles.forEach((obj, i) => {
        obj.position.z += s;
        // AABB 碰撞
        const dx = Math.abs(obj.position.x - player.position.x);
        const dz = Math.abs(obj.position.z - player.position.z);
        if (dx < 1.5 && dz < 1.5) {
            if (obj.userData.fatal && pState.y < 3) doGameOver();
            else if (!obj.userData.fatal && !pState.jumping) {
                pState.stumble = 1.5;
                shakeIntensity = 0.5;
                combo = 1; updateComboUI();
            }
        }
        if (obj.position.z > 20) { scene.remove(obj); obstacles.splice(i, 1); }
    });

    coins.forEach((c, i) => {
        c.position.z += s;
        c.rotation.y += 0.1;
        if (player.position.distanceTo(c.position) < 2) {
            scene.remove(c); coins.splice(i, 1); 
            score += 500; combo++; updateComboUI();
        }
        if (c.position.z > 20) { scene.remove(c); coins.splice(i, 1); }
    });

    tracks.forEach(t => {
        t.position.z += s;
        if (t.position.z > 40) {
            t.position.z -= 200;
            createTrackPart(t.position.z - 40);
        }
    });
}

function updateComboUI() {
    const el = document.getElementById('combo-val');
    el.innerText = combo;
    document.getElementById('combo').style.transform = "scale(1.3)";
    setTimeout(() => document.getElementById('combo').style.transform = "scale(1)", 200);
}

function setupControls() {
    let sX, sY;
    window.addEventListener('touchstart', e => { sX = e.touches[0].clientX; sY = e.touches[0].clientY; });
    window.addEventListener('touchend', e => {
        const dX = e.changedTouches[0].clientX - sX;
        const dY = e.changedTouches[0].clientY - sY;
        if (Math.abs(dX) > Math.abs(dY)) {
            if (dX > 40 && pState.lane < 2) pState.lane++;
            else if (dX < -40 && pState.lane > 0) pState.lane--;
        } else {
            if (dY < -40 && !pState.jumping) { pState.jumping = true; pState.vy = CONFIG.JUMP_V; }
            if (dY > 40) { pState.sliding = true; pState.slideTime = 0.6; player.scale.y = 0.5; }
        }
    });
    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' && pState.lane > 0) pState.lane--;
        if (e.key === 'ArrowRight' && pState.lane < 2) pState.lane++;
        if (e.key === 'ArrowUp' && !pState.jumping) { pState.jumping = true; pState.vy = CONFIG.JUMP_V; }
        if (e.key === 'ArrowDown') { pState.sliding = true; pState.slideTime = 0.6; player.scale.y = 0.5; }
    });
}

function startRun() {
    document.getElementById('overlay').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('overlay').style.display = 'none';
        isPlaying = true;
    }, 300);
}

function doGameOver() {
    isPlaying = false;
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('run_high', highScore);
    }
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('overlay').style.opacity = '1';
    document.getElementById('menu-card').innerHTML = `
        <h1 style="color:#d63031">BUSTED!</h1>
        <p>Score: ${score}</p>
        <p>Combo Max: ${combo}</p>
        <button onclick="location.reload()">TRY AGAIN</button>
    `;
}

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

init();
</script>
</body>
</html>
